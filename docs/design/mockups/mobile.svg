<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 910" width="830" height="910" role="img" aria-labelledby="ttl desc">
  <title id="ttl">بصيرة — نموذج بصري للجوال (375px)</title>
  <desc id="desc">شاشتان: لوحة القيادة، وقائمة المتطلبات مصفاة بـ «متأخر». نموذج تصميم ثابت ببيانات وهمية بتاريخ مرجعي 1 نوفمبر 2026.</desc>
  <style>
    text { font-family: "Segoe UI", Tahoma, "Noto Naskh Arabic", Arial, sans-serif; direction: rtl; fill: #0F1B2D; }
    .ltr { direction: ltr; unicode-bidi: embed; }
    .cap { font-size: 14px; font-weight: 700; fill: #12305A; }
    .muted { fill: #52627A; font-size: 12.5px; }
    .h1 { font-size: 20px; font-weight: 700; fill: #12305A; }
    .h2 { font-size: 15px; font-weight: 700; fill: #12305A; }
    .body { font-size: 13.5px; }
    .strong { font-size: 14px; font-weight: 700; }
    .kpi { font-size: 26px; font-weight: 700; fill: #12305A; }
    .card { fill: #FFFFFF; stroke: #D6DFEA; stroke-width: 1; }
    .link { fill: #0B7285; font-size: 13px; font-weight: 600; }
    .b-d { fill: #FDECEA; } .t-d { fill: #B42318; font-size: 12px; font-weight: 700; }
    .b-w { fill: #FFF4D6; } .t-w { fill: #8A5A00; font-size: 12px; font-weight: 700; }
    .b-n { fill: #E8EEF7; } .t-n { fill: #12305A; font-size: 12px; font-weight: 600; }
    .nav { font-size: 11.5px; fill: #52627A; }
    .nav-on { font-size: 11.5px; fill: #0B7285; font-weight: 700; }
  </style>
  <rect width="830" height="910" fill="#EEF2F8"/>

  <text x="810" y="36" class="cap">الجوال 375px — لوحة القيادة</text>
  <text x="395" y="36" class="cap">الجوال 375px — المتطلبات بتصفية «متأخر»</text>

  <!-- ======================= الشاشة 1: لوحة القيادة ======================= -->
  <g transform="translate(435,60)">
    <clipPath id="c1"><rect width="375" height="812" rx="28"/></clipPath>
    <g clip-path="url(#c1)">
      <rect width="375" height="812" fill="#F5F8FC"/>
      <rect width="375" height="56" fill="#0B1F3A"/>
      <text x="359" y="36" style="font-size:21px;font-weight:800;fill:#FFFFFF">بصيرة</text>
      <rect x="16" y="13" width="84" height="30" rx="8" fill="none" stroke="#FFFFFF" stroke-opacity=".7"/>
      <text x="58" y="33" text-anchor="middle" style="font-size:13px;fill:#FFFFFF;font-weight:600">البيانات</text>

      <rect x="16" y="66" width="343" height="30" rx="8" fill="#E3F6F8"/>
      <text x="351" y="86" style="font-size:12.5px;fill:#12305A">بيانات تجريبية وهمية ·</text>
      <text x="196" y="86" class="link" style="font-size:12.5px">إعادة البيانات التجريبية</text>

      <text x="359" y="128" class="h1">لوحة القيادة</text>
      <text x="16" y="128" text-anchor="end" class="muted" style="direction:rtl">1 نوفمبر 2026</text>

      <!-- التصنيف العربي -->
      <rect x="16" y="142" width="343" height="140" rx="12" class="card"/>
      <rect x="353" y="142" width="6" height="140" rx="3" fill="#1199A6"/>
      <text x="339" y="168" class="h2">التصنيف العربي للجامعات</text>
      <rect x="28" y="152" width="64" height="24" rx="12" class="b-d"/><text x="60" y="169" text-anchor="middle" class="t-d">في خطر</text>
      <text x="339" y="206" style="font-size:24px;font-weight:800;fill:#12305A">متبقٍ 9 أيام</text>
      <text x="150" y="204" style="font-size:12px;fill:#12305A;font-weight:600">مُدخل 0 من 9</text>
      <text x="339" y="232" class="body">الجاهزية</text>
      <rect x="70" y="223" width="200" height="8" rx="4" fill="#E8EEF7"/><rect x="248" y="223" width="22" height="8" rx="4" fill="#1199A6"/>
      <text x="56" y="232" class="ltr" style="font-size:12px;font-weight:700;fill:#12305A" text-anchor="end">11%</text>
      <text x="339" y="254" class="body">المتطلبات</text>
      <rect x="70" y="245" width="200" height="8" rx="4" fill="#E8EEF7"/>
      <text x="56" y="254" class="ltr" style="font-size:12px;font-weight:700;fill:#12305A" text-anchor="end">0%</text>
      <text x="339" y="274" style="font-size:12px;fill:#B42318">⚠ متطلبان متأخران · الجاهزية 11%</text>

      <!-- QS مختصرة -->
      <rect x="16" y="294" width="343" height="92" rx="12" class="card"/>
      <rect x="353" y="294" width="6" height="92" rx="3" fill="#1199A6"/>
      <text x="339" y="320" class="h2">QS</text>
      <rect x="28" y="304" width="80" height="24" rx="12" fill="#E6F4EC"/><text x="68" y="321" text-anchor="middle" style="font-size:12px;font-weight:700;fill:#1E7B4D">على المسار</text>
      <text x="339" y="352" style="font-size:18px;font-weight:800;fill:#12305A">متبقٍ 56 يومًا</text>
      <text x="339" y="376" style="font-size:12px;fill:#52627A">الجاهزية 0% · المتطلبات 33% · مُدخل 0 من 3</text>

      <!-- KPI 2 × 3 -->
      <rect x="196" y="398" width="163" height="64" rx="12" class="card"/><text x="343" y="428" class="kpi">5</text><text x="343" y="452" class="body">مفتوحة</text>
      <rect x="16" y="398" width="163" height="64" rx="12" class="card"/><rect x="173" y="398" width="6" height="64" rx="3" fill="#B42318"/><text x="159" y="428" class="kpi" style="fill:#B42318">2</text><text x="159" y="452" class="body">متأخرة</text>
      <rect x="196" y="472" width="163" height="64" rx="12" class="card"/><rect x="353" y="472" width="6" height="64" rx="3" fill="#C98A12"/><text x="339" y="502" class="kpi" style="fill:#8A5A00">2</text><text x="339" y="526" class="body">قريبة الموعد</text>
      <rect x="16" y="472" width="163" height="64" rx="12" class="card"/><text x="163" y="502" class="kpi">1</text><text x="163" y="526" class="body">تعارضات قيم</text>
      <rect x="196" y="546" width="163" height="64" rx="12" class="card"/><text x="343" y="576" class="kpi">1</text><text x="343" y="600" class="body">أسئلة مفتوحة</text>
      <rect x="16" y="546" width="163" height="64" rx="12" fill="#FFFFFF" stroke="#0B7285" stroke-width="1.5"/>
      <text x="97" y="583" text-anchor="middle" style="font-size:14px;font-weight:700;fill:#0B7285">+ إضافة متطلب</text>

      <!-- يحتاج انتباهك -->
      <text x="359" y="640" class="h2">يحتاج انتباهك</text>
      <rect x="16" y="652" width="343" height="80" rx="12" class="card"/>
      <text x="343" y="678" class="strong">تحديث أعداد أعضاء هيئة التدريس</text>
      <text x="343" y="698" class="muted">AR-EDU-1 · الموارد البشرية (وهمية)</text>
      <rect x="226" y="706" width="117" height="20" rx="10" class="b-d"/><text x="284" y="721" text-anchor="middle" class="t-d" style="font-size:11.5px">متأخر 12 يومًا</text>
      <rect x="168" y="706" width="50" height="20" rx="10" class="b-n"/><text x="193" y="721" text-anchor="middle" class="t-n" style="font-size:11.5px">عالية</text>

      <!-- الشريط السفلي -->
      <rect x="0" y="748" width="375" height="64" fill="#FFFFFF"/>
      <rect x="0" y="748" width="375" height="1" fill="#D6DFEA"/>
      <rect x="315" y="749" width="45" height="3" rx="1.5" fill="#1199A6"/>
      <circle cx="337.5" cy="772" r="8" fill="none" stroke="#0B7285" stroke-width="2"/><text x="337.5" y="798" text-anchor="middle" class="nav-on">القيادة</text>
      <circle cx="262.5" cy="772" r="8" fill="none" stroke="#7A8AA2" stroke-width="2"/><text x="262.5" y="798" text-anchor="middle" class="nav">المؤشرات</text>
      <circle cx="187.5" cy="772" r="8" fill="none" stroke="#7A8AA2" stroke-width="2"/><text x="187.5" y="798" text-anchor="middle" class="nav">المتطلبات</text>
      <circle cx="112.5" cy="772" r="8" fill="none" stroke="#7A8AA2" stroke-width="2"/><text x="112.5" y="798" text-anchor="middle" class="nav">المتابعات</text>
      <circle cx="37.5" cy="772" r="8" fill="none" stroke="#7A8AA2" stroke-width="2"/><text x="37.5" y="798" text-anchor="middle" class="nav">المزيد</text>
    </g>
    <rect width="375" height="812" rx="28" fill="none" stroke="#0B1F3A" stroke-width="3"/>
  </g>

  <!-- ======================= الشاشة 2: المتطلبات ======================= -->
  <g transform="translate(20,60)">
    <clipPath id="c2"><rect width="375" height="812" rx="28"/></clipPath>
    <g clip-path="url(#c2)">
      <rect width="375" height="812" fill="#F5F8FC"/>
      <rect width="375" height="56" fill="#0B1F3A"/>
      <text x="359" y="36" style="font-size:19px;font-weight:700;fill:#FFFFFF">المتطلبات</text>
      <rect x="16" y="13" width="84" height="30" rx="8" fill="none" stroke="#FFFFFF" stroke-opacity=".7"/>
      <text x="58" y="33" text-anchor="middle" style="font-size:13px;fill:#FFFFFF;font-weight:600">البيانات</text>

      <!-- البحث -->
      <rect x="16" y="68" width="343" height="44" rx="8" fill="#FFFFFF" stroke="#7A8AA2"/>
      <circle cx="337" cy="88" r="7" fill="none" stroke="#52627A" stroke-width="2"/><line x1="332" y1="93" x2="327" y2="98" stroke="#52627A" stroke-width="2"/>
      <text x="317" y="95" style="font-size:13.5px;fill:#52627A">ابحث في العنوان والوصف والنواقص</text>

      <!-- التصفية -->
      <rect x="251" y="122" width="108" height="36" rx="8" fill="#FFFFFF" stroke="#0B7285" stroke-width="1.5"/>
      <text x="305" y="145" text-anchor="middle" style="font-size:13.5px;font-weight:700;fill:#0B7285">تصفية (1)</text>
      <rect x="153" y="126" width="88" height="28" rx="14" fill="#E3F6F8"/>
      <text x="197" y="145" text-anchor="middle" style="font-size:12.5px;font-weight:700;fill:#12305A">متأخر  ✕</text>
      <text x="16" y="145" text-anchor="end" style="font-size:12.5px;fill:#0B7285;font-weight:600;direction:rtl">الأكثر إلحاحًا ▾</text>

      <text x="359" y="184" class="muted" style="font-size:13px;fill:#12305A">عدد النتائج: 2 من 6</text>

      <!-- بطاقة F1 -->
      <rect x="16" y="196" width="343" height="132" rx="12" class="card"/>
      <rect x="353" y="196" width="6" height="132" rx="3" fill="#B42318"/>
      <text x="339" y="224" class="strong">تحديث أعداد أعضاء هيئة التدريس</text>
      <rect x="222" y="236" width="117" height="22" rx="11" class="b-d"/><text x="280" y="252" text-anchor="middle" class="t-d">متأخر 12 يومًا</text>
      <rect x="114" y="236" width="100" height="22" rx="11" class="b-n"/><text x="164" y="252" text-anchor="middle" class="t-n">قيد التنفيذ</text>
      <rect x="56" y="236" width="50" height="22" rx="11" class="b-n"/><text x="81" y="252" text-anchor="middle" class="t-n">عالية</text>
      <text x="339" y="282" class="body">AR-EDU-1 · وحدة الموارد البشرية (وهمية)</text>
      <text x="339" y="304" class="muted">المكلَّف: د. مكلف (أ) · آخر متابعة: 22 أكتوبر 2026</text>
      <text x="339" y="322" class="muted">ينقص: عدد غير المتفرغين</text>

      <!-- بطاقة F6 -->
      <rect x="16" y="340" width="343" height="132" rx="12" class="card"/>
      <rect x="353" y="340" width="6" height="132" rx="3" fill="#B42318"/>
      <text x="339" y="368" class="strong">بيانات الخبراء المنتدبين من خارج الجامعة</text>
      <rect x="222" y="380" width="117" height="22" rx="11" class="b-d"/><text x="280" y="396" text-anchor="middle" class="t-d">متأخر 7 أيام</text>
      <rect x="114" y="380" width="100" height="22" rx="11" class="b-n"/><text x="164" y="396" text-anchor="middle" class="t-n">بانتظار الجهة</text>
      <rect x="56" y="380" width="50" height="22" rx="11" class="b-n"/><text x="81" y="396" text-anchor="middle" class="t-n">عالية</text>
      <text x="339" y="426" class="body">AR-EDU-6 · وحدة الشؤون الأكاديمية (وهمية)</text>
      <text x="339" y="448" class="muted">المكلَّف: د. مكلف (هـ) · لا متابعات بعد</text>
      <text x="339" y="466" class="muted">ينقص: ردود الكليات على خطاب الطلب</text>

      <text x="187.5" y="506" text-anchor="middle" class="link">مسح البحث والتصفية</text>

      <!-- زر الإضافة الثابت -->
      <rect x="16" y="684" width="343" height="48" rx="10" fill="#1B3F73"/>
      <text x="187.5" y="714" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#FFFFFF">+ إضافة متطلب</text>

      <!-- الشريط السفلي -->
      <rect x="0" y="748" width="375" height="64" fill="#FFFFFF"/>
      <rect x="0" y="748" width="375" height="1" fill="#D6DFEA"/>
      <rect x="165" y="749" width="45" height="3" rx="1.5" fill="#1199A6"/>
      <circle cx="337.5" cy="772" r="8" fill="none" stroke="#7A8AA2" stroke-width="2"/><text x="337.5" y="798" text-anchor="middle" class="nav">القيادة</text>
      <circle cx="262.5" cy="772" r="8" fill="none" stroke="#7A8AA2" stroke-width="2"/><text x="262.5" y="798" text-anchor="middle" class="nav">المؤشرات</text>
      <circle cx="187.5" cy="772" r="8" fill="none" stroke="#0B7285" stroke-width="2"/><text x="187.5" y="798" text-anchor="middle" class="nav-on">المتطلبات</text>
      <circle cx="112.5" cy="772" r="8" fill="none" stroke="#7A8AA2" stroke-width="2"/><text x="112.5" y="798" text-anchor="middle" class="nav">المتابعات</text>
      <circle cx="37.5" cy="772" r="8" fill="none" stroke="#7A8AA2" stroke-width="2"/><text x="37.5" y="798" text-anchor="middle" class="nav">المزيد</text>
    </g>
    <rect width="375" height="812" rx="28" fill="none" stroke="#0B1F3A" stroke-width="3"/>
  </g>

  <text x="810" y="898" style="font-size:12px;fill:#52627A">نموذج بصري ثابت · ليس الواجهة المنفذة · بيانات وهمية</text>
</svg>
