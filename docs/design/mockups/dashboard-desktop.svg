    .nav-on { font-size: 15px; font-weight: 700; fill: #FFFFFF; }
    .card { fill: #FFFFFF; stroke: #D6DFEA; stroke-width: 1; }
    .link { fill: #0B7285; font-size: 14px; font-weight: 600; }
    .b-d { fill: #FDECEA; } .t-d { fill: #B42318; font-size: 12.5px; font-weight: 700; }
