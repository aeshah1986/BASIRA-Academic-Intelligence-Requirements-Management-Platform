    .b-i { fill: #E3F6F8; } .t-i { fill: #12305A; font-size: 12.5px; font-weight: 700; }
    .b-n { fill: #E8EEF7; } .t-n { fill: #12305A; font-size: 12.5px; font-weight: 600; }
  </style>

