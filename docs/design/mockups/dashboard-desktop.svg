<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 920" width="1280" height="920" role="img" aria-labelledby="ttl desc">
  <title id="ttl">بصيرة — نموذج بصري للوحة القيادة (حاسوب)</title>
  <desc id="desc">نموذج تصميم ثابت وليس الواجهة المنفذة. بيانات وهمية بتاريخ مرجعي 1 نوفمبر 2026.</desc>
